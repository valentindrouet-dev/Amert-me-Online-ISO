<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amertüme ISO</title>
<style>
@font-face{font-family:'Killam';src:url('fonts/killam-bold.woff2') format('woff2');font-weight:700}
/* Couleurs : thème sombre de la charte d'Amertüme Online (body.sombre). */
:root{color-scheme:dark;--bg:#10171a;--panel:#182226;--panel-2:#131d21;--btn:#243136;--hover:#26343a;--track:#0d1417;
 --line:#2d393d;--line-strong:#526065;--muted:#a4b1b5;--ink:#edf0e9;--accent:#e2ae72;--on-accent:#201b15;--green:#8ab5a0;--red-mat:#d4735a;
 --act:#4f7fb5;--mvt:#8a6440;--reac:#8b6bb5;--pass:#8a8474;--crit:#b5525a;--ame:#5e9a5b;--mait:#c99a3c;--bonus:#2a9d8f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:16px system-ui,sans-serif;overflow:hidden;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.k{font-family:'Killam',Georgia,serif;font-weight:700}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line-strong);border-radius:12px}
.sec{font:600 12px system-ui;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
/* Cadre du héros : portrait cerclé de ses PV, nom, classe, VIE, caracs, états */
#frame{position:fixed;left:12px;top:12px;display:flex;gap:12px;padding:10px 14px 10px 10px;align-items:center}
#pwrap{position:relative;width:86px;height:86px;flex:none;border-radius:50%;padding:5px;background:conic-gradient(#c0392b var(--pv,100%),#2a1512 0)}
#pwrap::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px #0009,0 0 0 2px var(--mait)}
#portrait{width:76px;height:76px;border-radius:50%;background:radial-gradient(#2b3a3e,#10171a);display:block}
#pvtxt{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:800 11px system-ui;background:#2a1512;border:1px solid #c0392b;border-radius:8px;padding:0 6px;white-space:nowrap}
#fname{font-size:22px;line-height:1}
.cart{display:inline-block;font:700 10px system-ui;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:#b0452e;color:#fff;margin:4px 0 6px}
.pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pills+.pills{margin-top:5px}.pills:empty{display:none}
.carac{display:inline-flex;flex-direction:column;align-items:center;min-width:38px;padding:2px 5px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
.carac small{font:600 9px system-ui;letter-spacing:1.5px;color:var(--muted)}.carac b{font:700 16px 'Killam',Georgia,serif;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:3px;font:700 12px system-ui;padding:1px 7px;border-radius:9px;background:var(--btn);border:1px solid var(--line)}
.pill img{width:16px;height:16px}
.etat{border-color:var(--t);color:var(--t);background:color-mix(in srgb,var(--t) 15%,var(--panel))}
.vie{width:15px;height:15px;opacity:.2;filter:grayscale(1)}.vie.on{opacity:1;filter:none}
.bar{position:relative;height:16px;border-radius:8px;background:var(--track);border:1px solid var(--line);overflow:hidden;width:220px}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#d4735a,#a4442f);transition:width .2s}
.bar>span{position:absolute;inset:0;text-align:center;font:700 11px/15px system-ui;text-shadow:0 1px 2px #000}
/* Barre d'action : orbe de PV, cases, orbe de Rage */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:14px;padding:8px 12px;border-radius:16px}
.orbe{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 60%,#1a1210,#070505);box-shadow:0 0 0 3px #3a2c20,0 0 0 5px var(--mait),0 4px 12px #000a}
.orbe>i{position:absolute;left:0;right:0;bottom:0;height:var(--f,100%);background:var(--g);transition:height .25s}
.orbe::after{content:'';position:absolute;left:18%;top:8%;width:46%;height:28%;border-radius:50%;background:radial-gradient(#ffffff55,transparent 70%)}
.orbe span{position:absolute;inset:0;display:grid;place-items:center;font:700 20px 'Killam',Georgia,serif;text-shadow:0 2px 3px #000,0 0 2px #000;z-index:1}
.orbe small{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 9px system-ui;letter-spacing:2px;text-transform:uppercase;z-index:1;text-shadow:0 1px 2px #000}
#oPV{--g:linear-gradient(#e0533f,#7a1a12)}#oRage{--g:linear-gradient(#f08a3a,#8a2e10)}
#centre{display:flex;flex-direction:column;align-items:center;gap:6px}
#ronds{display:flex;gap:6px;align-items:flex-end}
.sep{width:2px;height:44px;background:var(--line);margin:0 4px;align-self:center}
.slot{position:relative;width:58px;height:58px;border-radius:8px;cursor:pointer;background:linear-gradient(#1b2629,#0d1417);border:2px solid color-mix(in srgb,var(--t) 70%,#000);box-shadow:inset 0 0 10px #000,0 2px 6px #000a;display:grid;place-items:center}
.slot:hover{border-color:var(--t);box-shadow:inset 0 0 10px #000,0 0 10px color-mix(in srgb,var(--t) 60%,transparent)}
.slot img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 2px #000)}
.slot .h{position:absolute;top:2px;left:4px;font:800 11px system-ui;color:var(--ink);text-shadow:0 1px 2px #000}
.slot .q{position:absolute;bottom:1px;right:4px;font:800 13px system-ui;text-shadow:0 1px 2px #000,0 0 2px #000}
.slot .cd{position:absolute;inset:0;border-radius:6px;background:conic-gradient(#000c var(--p,0%),transparent 0)}
.slot .s{position:absolute;inset:0;display:grid;place-items:center;font:800 16px system-ui;text-shadow:0 1px 3px #000}
.slot.off img{filter:grayscale(1) brightness(.5)}.slot.off{cursor:default}
.slot.flash{animation:eclat .5s}
@keyframes eclat{40%{transform:scale(1.12);box-shadow:0 0 18px var(--t)}}
#xp{position:relative;width:100%;min-width:330px;height:12px;border-radius:6px;background:var(--track);border:1px solid var(--line);overflow:hidden}
#xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--mait),#e2ae72);width:0;transition:width .3s}
#xpt{position:absolute;inset:0;text-align:center;font:700 9px/11px system-ui;letter-spacing:1px;text-shadow:0 1px 2px #000}
/* Ronds de talent (fenêtre des talents) */
.rond{position:relative;width:62px;text-align:center;cursor:pointer}
.rond .o{position:relative;width:56px;height:56px;margin:auto;border-radius:12px;border:4px solid var(--t);background:color-mix(in srgb,var(--t) 22%,#e9e3d5);display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 6px #0008}
.rond .o img{width:40px;height:40px;object-fit:contain}
.rond .o b{font-size:24px;color:var(--t)}
.rond .n{font:600 11px system-ui;margin-top:3px;color:var(--ink);white-space:nowrap}
/* Boutons */
.btn{font:600 14px system-ui;background:var(--btn);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 12px var(--mait)}}
#top{position:fixed;right:12px;top:12px;display:flex;gap:6px}
/* Journal */
#journal{display:none!important;position:fixed;right:12px;top:58px;width:340px;max-height:46vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#journal .l{font-size:13px;line-height:1.35;padding:4px 8px;border-radius:9px;border:1px solid color-mix(in srgb,var(--t) 55%,transparent);background:color-mix(in srgb,var(--t) 14%,var(--panel))}
.de{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font:700 11px system-ui;color:#201b15;background:var(--d);margin:0 1px;vertical-align:-2px;box-shadow:inset 0 0 0 1px #0006}
.de.dark{color:#f4f6f2}.de.x{opacity:.3;text-decoration:line-through}.de.b{opacity:.45}.de.p{outline:1px solid #ffd34a}
.hro{color:var(--green);font-weight:700}.adv{color:#e2565f;font-weight:700}
/* Bulle (infobulle d'adversaire / de talent) */
#tip{position:fixed;pointer-events:none;max-width:280px;padding:8px 10px;font-size:13px;display:none;z-index:9}
#tip h4{margin:0 0 4px;font:700 16px 'Killam',Georgia,serif;color:var(--t,var(--ink))}
#tip p{margin:3px 0}
/* Barre de boss */
#boss{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:420px;text-align:center;display:none}
#boss .bar{width:100%;height:14px}
/* Fenêtres */
.dlg{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:10}
.dlg.on{display:grid}
.win{width:min(760px,94vw);max-height:88vh;overflow:auto;padding:16px 18px}
.win h2{margin:0 0 10px;font:700 24px 'Killam',Georgia,serif;display:flex;justify-content:space-between}
.x{cursor:pointer;color:var(--muted)}
.arbre{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.branche{padding:10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.branche .rond{width:auto;margin:auto}
.ames{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ames .rond{width:58px}.ames .rond .o{width:38px;height:38px;border-width:3px}.ames .rond .o b{font-size:16px}
.rond.ok .o{box-shadow:0 0 10px var(--t)}
.rond.lock{opacity:.45;cursor:default}
#mj{position:fixed;right:12px;bottom:12px;padding:10px;display:none;width:240px}
#mj.on{display:block}
#edit{position:fixed;left:12px;bottom:12px;padding:10px;width:300px;display:none}#edit.on{display:block}
#edit .row,.reg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.reg{font:600 12px system-ui;color:var(--muted);justify-content:space-between}.reg input{width:100%}
#edMsg{font-size:12px;color:var(--accent);min-height:1em;margin:4px 0}
body.edition #bar,body.edition #frame,body.edition #journal{display:none}
#mj .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#fin{z-index:11}
#fin .win{text-align:center;width:420px}
@media (max-width:900px){.orbe{width:64px;height:64px}.slot{width:46px;height:46px}.slot img{width:34px;height:34px}#xp{min-width:200px}#pwrap{width:64px;height:64px}#portrait{width:54px;height:54px}}
@media (prefers-reduced-motion:reduce){.slot.flash,.btn.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="frame" class="panel">
 <div id="pwrap"><canvas id="portrait" width="152" height="152"></canvas><span id="pvtxt"></span></div>
 <div>
  <div id="fname" class="k">Hrolf</div>
  <div class="cart" id="fcart">Destructeur · palier I</div>
  <div class="pills" id="fstats"></div>
  <div class="pills" id="fetats"></div>
 </div>
</div>
<div id="boss" class="panel" style="padding:6px 10px"><div class="k" id="bossn"></div><div class="bar"><i></i><span></span></div></div>
<div id="top">
 <button class="btn" id="bTal">Talents (T)</button>
 <button class="btn" id="bMJ">MJ (M)</button>
 <button class="btn" id="bPause">Pause (Espace)</button>
</div>
<div id="journal" class="panel"></div>
<div id="bar" class="panel">
 <div class="orbe" id="oPV"><i></i><span></span><small>PV</small></div>
 <div id="centre"><div id="ronds"></div><div id="xp"><i></i><span id="xpt"></span></div></div>
 <div class="orbe" id="oRage"><i></i><span></span><small>Rage</small></div>
</div>
<div id="mj" class="panel">
 <div class="sec">Meneur de jeu</div>
 <div class="row" id="mjSpawn"></div>
 <div class="row"><button class="btn" id="mjLong">Repos long</button><button class="btn" id="mjAggro">Zones</button></div>
 <div class="row" id="mjXp"></div>
 <div class="row"><button class="btn" id="mjEdit">Éditer la carte</button></div>
 <div class="sec">Réglages</div>
 <label class="reg">Cadence de la hache <b id="vCad"></b><input type="range" id="rCad" min="0.5" max="4" step="0.1"></label>
 <label class="reg">Durée d’un tour <b id="vTour"></b><input type="range" id="rTour" min="2" max="8" step="0.5"></label>
</div>
<div id="edit" class="panel">
 <div class="sec">Carte</div>
 <div class="row" id="edOutils"><button class="btn on" data-o="sol">Sol</button><button class="btn" data-o="mur">Mur</button><button class="btn" data-o="depart">Départ</button><button class="btn" data-o="gomme">Gomme</button></div>
 <div class="row" id="edPinceau"><span class="sec">Pinceau</span><button class="btn on" data-p="0">1</button><button class="btn" data-p="1">3</button><button class="btn" data-p="2">5</button></div>
 <div class="row"><label class="btn">Fond…<input type="file" accept="image/*" id="edFond" hidden></label><button class="btn" id="edTout">Tout en sol</button><button class="btn" id="edVide">Tout en mur</button></div>
 <div class="row"><button class="btn" id="edSauve">Sauver</button><button class="btn" id="edExport">Exporter</button><label class="btn">Importer<input type="file" accept=".json,application/json" id="edImport" hidden></label><button class="btn" id="edDemo">Démo</button></div>
 <div id="edMsg"></div>
 <div class="row"><button class="btn main" id="edJouer">Jouer</button></div>
</div>
<div id="tip" class="panel"></div>
<div class="dlg" id="dTal"><div class="win panel"><h2><span>Talents du Destructeur</span><span class="x" data-close>✕</span></h2><div id="marques" class="sec" style="margin-bottom:10px"></div><div class="arbre" id="arbre"></div></div></div>
<div class="dlg" id="fin"><div class="win panel"><h2 style="justify-content:center" id="finT"></h2><p id="finP"></p><button class="btn main" id="bRe">Recommencer</button></div></div>
<script>
'use strict';
const VERSION='0.4';
document.title='Amertüme ISO v'+VERSION;

/* ================= Règles d'Amertüme (moteur d'Amertüme Online, adapté au temps réel) =================
   Dés : W Simple, L Léger, R Lourd, B Mystique, S Soin, M Mortel, P Phase, V Poison. Tous des d6. */
const DES={W:['Simple','#ece7db'],L:['Léger','#dcb87f'],R:['Lourd','#c0392b',1],B:['Mystique','#3f7bc0',1],S:['Soin','#5fa45f'],M:['Mortel','#2b2b2b',1],P:['Phase','#d8c13a'],V:['Poison','#7b4bb3',1]};
const ETATS={Rage:'#d4552a',Saignée:'#e2565f',Feu:'#f0903a',Poison:'#b968d3','Au sol':'#d39568',Coma:'#8a8474'};
const ETAT_IC={Saignée:'img/etats/saignee.png',Feu:'img/etats/feu.png',Poison:'img/etats/poison.png','Au sol':'img/etats/ausol.png'};
// Réglages du MJ, gardés dans ce navigateur : cadence de l'arme du héros, durée d'un « tour » (rythme des PA, du Feu, des adversaires).
const REG={cadence:1.5,tour:6};try{Object.assign(REG,JSON.parse(localStorage.getItem('amertume-iso-reglages'))||{})}catch(e){}
let TOUR=REG.tour;
const CADENCE=2,CADENCE_2M=3.5; // carte dynamique d'Amertüme Online : 2 s, 3,5 s à deux mains, sauf cadence d'arme
const d6=()=>1+Math.floor(Math.random()*6);
/* Lancer : les dés Légers doublés s'en vont, deux 1 = échec (hors Mortel/Poison), deux 6 = critique (Destructeur au contact :
   tout double hors 1) ; au critique, un dé de la première couleur, encore un tant qu'il fait 6. */
function lancer(des,o){o=o||{};const d=[...des].map(c=>({c,v:d6()}));
 d.forEach((x,i)=>{if(x.c==='L'&&d.some((y,j)=>j!==i&&y.v===x.v))x.out=1});
 const k=d.filter(x=>!x.out);
 if(k.filter(x=>x.v===1&&x.c!=='M'&&x.c!=='V').length>=2)return{d,echec:1};
 let crit=k.filter(x=>x.v===6).length>=2;
 if(!crit&&o.doubles){const n={};k.forEach(x=>n[x.v]=(n[x.v]||0)+1);crit=Object.keys(n).some(v=>v!=='1'&&n[v]>=2)}
 if(crit){let x,g=0;do{x={c:des[0],v:d6(),plus:1};d.push(x);k.push(x)}while(x.v===6&&++g<20)}
 return{d,k,crit}}
/* Résoudre contre une DEF : un dé passe si sa face dépasse la DEF ; 6, Lourd et Mortel passent toujours. Mystique doublé si un
   autre dé gardé a sa face. Si un dé passe : + bonus de Dégâts + Saignée de la cible. */
function resoudre(l,def,bonus,saignee){if(l.echec)return{total:0,passe:0,poison:0,faces:l.d.map(x=>({...x}))};
 let total=0,passe=0,poison=0;const faces=l.d.map(x=>{const f={...x};if(x.out)return f;
  if(!(x.v===6||x.c==='R'||x.c==='M'||x.v>def)){f.bloque=1;return f}
  let v=x.v;if(x.c==='B'&&l.k.some(y=>y!==x&&y.v===x.v))v*=2;if(x.c==='V')poison+=x.v;total+=v;passe++;f.passe=1;return f});
 if(passe)total+=Math.max(0,bonus||0)+(saignee||0);return{total,passe,poison,faces}}
// Auto-contrôle des règles de dés (console).
(function(){const L=(d,crit)=>({d,k:d.filter(x=>!x.out),crit});
 const r=resoudre(L([{c:'W',v:5},{c:'R',v:2},{c:'B',v:4},{c:'B',v:4}]),3,2,0);console.assert(r.total===25,'moteur d’Online : chaque Mystique apparié double (5+2+8+8+2)',r);
 console.assert(resoudre(L([{c:'W',v:3}]),3,2,0).total===0,'DEF bloque');console.assert(resoudre(L([{c:'W',v:6}]),6,0,1).total===7,'6 passe toujours + Saignée');})();

/* ================= Données ================= */
// Adversaires : fiches du catalogue d'Amertüme Online ; sprites de Defenders.
const ADV={
 rodeur:{nom:'Rôdeur famélique',type:'standard',famille:'Bête',pv:6,def:3,degats:2,xp:5,spr:'rodeur',att:[{nom:'Griffes',des:'WW'}]},
 charo:{nom:'Charognard enragé',type:'standard',famille:'Charognard',pv:8,def:2,degats:3,xp:7,rapide:1,spr:'charo',att:[{nom:'Morsure',des:'WL'}]},
 mystique:{nom:'Mystique déchu',type:'solitaire',famille:'Humanoïde',pv:14,def:4,degats:2,xp:15,spr:'ombre',distance:1,att:[{nom:'Boule de feu',des:'BB',feu:1}]},
 // Kobold : 7 PV et 3 XP (tests d'Online) ; DEF, Dégâts, attaque et Rapide provisoires en attendant sa fiche.
 kobold:{nom:'Kobold',type:'standard',famille:'Kobold',pv:7,def:2,degats:1,xp:3,spr:'kobold',rapide:1,att:[{nom:'Griffes',des:'WW'}]},
 colosse:{nom:'Colosse d’Amertume',type:'boss',famille:'Colosse',pv:30,def:5,degats:4,xp:40,spr:'colosse',boss:1,att:[{nom:'Coup massif',des:'RRR'},{nom:'Onde de choc',des:'WW',tous:1,auSol:1}]}};
// Taille dessinée du pas w1 (½ de la taille du fichier), comme MS dans Defenders.
const MS={rodeur:[28.5,17],charo:[19.5,27],ombre:[28,29.5],colosse:[93,88],kobold:[34,34]};
// Sprites animés : bandes de 6 images (img/m/<spr>_<pose>.webp), dessinées à ½ ; pieds à 74/77 de la hauteur.
const ANIM={kobold:{n:6,pieds:74/77,poses:['idle','special','walk','atk','atk2']}};
// Talents du Destructeur (combat.js d'Amertüme Online) ; « de » = talent de base d'une amélioration.
const TAL={
 destructeur:{nom:'Destructeur',type:'mait',ic:'talent_destructeur',inne:1,txt:'Avec une arme au contact, <b>tous vos doubles</b> sont des critiques ; un double 1 reste un échec.'},
 rage:{nom:'Rage',type:'mait',inne:1,txt:'Chaque point de <b>Rage</b> : <b>+1</b> aux dégâts au contact. <b>+1 Rage</b> chaque fois que vous subissez des dégâts en combat.'},
 rage_crit:{nom:'Critiques',de:'rage',txt:'<b>+1 Rage</b> à chaque critique.'},
 rage_tue:{nom:'Adversaires tués',de:'rage',txt:'<b>+1 Rage</b> à chaque adversaire tué.'},
 rage_depart:{nom:'Début du combat',de:'rage',txt:'Chaque combat commence avec <b>1d6 Rage</b>.'},
 rage_infinie:{nom:'Rage Infinie',de:'rage',txt:'Tous vos gains de <b>Rage</b> sont <b>doublés</b>.'},
 frappe:{nom:'Frappe Furieuse',type:'act',touche:'1',ic:'talent_attaque',txt:'<b>Action</b> : une attaque, puis <b>1 Rage</b>.'},
 frappe_melee:{nom:'Mêlée',de:'frappe',txt:'<b>+1 Rage</b> par adversaire au contact.'},
 frappe_saignee:{nom:'Saignée',de:'frappe',txt:'Inflige <b>Saignée</b>.'},
 frappe_mortelle:{nom:'Mortelle',de:'frappe',txt:'<b>1 dé Mortel</b> de dégâts en plus.'},
 cri:{nom:'Cri de Guerre',type:'bonus',touche:'2',ic:'talent_provocation',txt:'<b>Action bonus</b>, une fois par combat : un adversaire au contact est <b>repoussé</b> et subit vos dégâts d’Opportunité.'},

document.querySelectorAll('.dlg').forEach(d=>d.addEventListener('pointerdown',e=>{if(e.target===d&&d.id!=='fin')ouvre(d.id,false)}));

$('mjSpawn').onclick=e=>{const b=e.target.closest('[data-adv]');if(!b)return;mjSpawn=mjSpawn===b.dataset.adv?null:b.dataset.adv;$('mjSpawn').querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x.dataset.adv===mjSpawn))};

$('mjXp').onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;xpMul=+b.dataset.x;$('mjXp').querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))};
$('ronds').addEventListener('click',e=>{const r=e.target.closest('.slot');if(!r)return;const k=r.dataset.k;({frappe:frappeFurieuse,cri:criDeGuerre,potion,repos:reposCourt})[k]?.()});
$('bRe').onclick=()=>{ouvre('fin',false);nouveau()};
function fin(t,p,gagne){$('finT').textContent=t;$('finP').textContent=p;$('bRe').textContent=gagne?'Recommencer la démo':'Recommencer';ouvre('fin',true);if(gagne)$('fin').addEventListener('pointerdown',function f(e){if(e.target===$('fin')){ouvre('fin',false);$('fin').removeEventListener('pointerdown',f)}})}
// Infobulles (bulle de talent / fiche d'adversaire)
const tip=$('tip');
function montreTip(html,x,y,c){tip.innerHTML=html;tip.style.setProperty('--t',c||'var(--ink)');tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-h-10)+'px'}
const TIP_SLOT={frappe:'frappe',cri:'cri'};
document.addEventListener('pointerover',e=>{const r=e.target.closest('.rond,.slot');if(!r){if(!survol)tip.style.display='none';return}const k=r.dataset.tal||TIP_SLOT[r.dataset.k],b=r.getBoundingClientRect();
 if(r.dataset.k==='potion')return montreTip(`<h4>Potion de soin</h4><p>Rend <b>2 dés Soin</b> de PV. Reste : <b>${hero.potions}</b>.</p>`,b.left,b.top,'var(--ame)');
 if(r.dataset.k==='repos')return montreTip(`<h4>Repos court</h4><p>Hors combat : <b>1d6 + Endurance</b> PV, lève les états. Un seul entre deux combats, <b>${Math.max(0,hero.vie-hero.reposCourts)}</b> avant un repos long.</p>`,b.left,b.top,'var(--green)');
 if(k){const T=TAL[k];montreTip(`<h4>${T.de?TAL[T.de].nom+' — ':''}${T.nom}</h4><p>${T.txt}</p>`,b.left,b.top,'var(--'+tType(k)+')')}
 else if(r.dataset.k==='auto')montreTip(`<h4>${hero.arme.nom}</h4><p>${desHtml([...hero.arme.des].map(c=>({c,v:'·'})))} · deux mains · un coup toutes les <b>${hero.arme.cadence} s</b>, au contact, sur l’adversaire le plus proche.</p>`,b.left,b.top,'var(--act)')});
// Souris : clic au sol = marcher ; clic sur un adversaire = marcher jusqu'à son contact et le frapper (carte dynamique).
let survol=null,tenu=false,mx=0,my=0;
const monde=(x,y)=>({x:cam.x+(x-VW/2)/cam.z,y:cam.y+(y-VH/2)/cam.z});
function sous(x,y){const p=monde(x,y);let best=null;for(const m of vivants()){if(Math.abs(p.x-m.x)<m.w/2+4&&p.y<m.y+6&&p.y>m.y-m.h-4&&(!best||m.y>best.y))best=m}return best}
function ordre(x,y){if(hero.coma||hero.auSol>0)return;const m=sous(x,y);if(m){hero.cible=m;hero.path=chemin(hero.x,hero.y,m.x,m.y);return}
 hero.cible=null;const p=monde(x,y);hero.path=chemin(hero.x,hero.y,p.x,p.y)}
cv.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;
 if(edit)return edDown(e);if(e.button!==0)return;
 if(mjSpawn){const p=monde(mx,my);if(walkXY(p.x,p.y)){campe(mjSpawn,p.x,p.y,ADV[mjSpawn].boss||ADV[mjSpawn].distance?1:3);S.gagne=0}return}
 tenu=true;ordre(mx,my)});
addEventListener('pointerup',()=>{tenu=false;peint=false;pan=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(edit)return edMove();survol=sous(mx,my);
 if(survol){const d=survol.d;montreTip(`<h4>${d.nom}</h4><p>${d.famille} · ${d.type}</p><p>PV <b>${survol.pv}</b>/${d.pv} · DEF <b>${d.def}</b> · Dégâts <b>+${d.degats}</b> · XP <b>${d.xp}</b></p>${d.att.map(a=>`<p>${a.nom} : ${desHtml([...a.des].map(c=>({c,v:'·'})))}${a.feu?' · Feu':''}${a.auSol?' · Au sol':''}${a.tous?' · tous au contact':''}</p>`).join('')}`,mx,my,'#e2565f')}
 else if(!e.target.closest('.rond,.slot'))tip.style.display='none'});
const zMin=()=>Math.max(VW/WW,VH/WH);
cv.addEventListener('wheel',e=>{cam.z=Math.max(zMin(),Math.min(3.2,cam.z*(e.deltaY<0?1.1:.9)));e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
 if(k==='1')frappeFurieuse();else if(k==='2')criDeGuerre();else if(k==='q')potion();else if(k==='r')reposCourt();
 else if(k==='t')$('bTal').click();else if(k==='m')$('bMJ').click();else if(k===' '){$('bPause').click();e.preventDefault()}
 else if(k==='escape'){ouvre('dTal',false);mjSpawn=null;$('mjSpawn').querySelectorAll('.btn').forEach(x=>x.classList.remove('on'))}});
/* ================= Éditeur de carte (MJ) ================= */
let outil='sol',pinceau=0,peint=false,pan=null;
const edMsg=t=>{$('edMsg').textContent=t||''};
function entreEdit(on){edit=on;$('edit').classList.toggle('on',on);$('mjEdit').classList.toggle('on',on);document.body.classList.toggle('edition',on);edMsg('');
 if(!on){CARTE.walk=[...WALK];nouveau()}else{hero.path=[];hero.cible=null;S.mons.forEach(m=>{m.aggro=0})}}
function grilleEdition(){const cs=[cellOf(0,0),cellOf(WW,0),cellOf(0,WH),cellOf(WW,WH)],I=cs.map(c=>c.i),J=cs.map(c=>c.j);g.lineWidth=1/cam.z;
 for(let i=Math.min(...I)-1;i<=Math.max(...I)+1;i++)for(let j=Math.min(...J)-1;j<=Math.max(...J)+1;j++){const p=iso(i,j);if(p.x<-TW||p.y<-TH||p.x>WW+TW||p.y>WH+TH)continue;
  g.beginPath();g.moveTo(p.x,p.y-TH/2);g.lineTo(p.x+TW/2,p.y);g.lineTo(p.x,p.y+TH/2);g.lineTo(p.x-TW/2,p.y);g.closePath();
  if(walkC(i,j)){g.fillStyle='rgba(138,181,160,.32)';g.fill();g.strokeStyle='rgba(138,181,160,.6)'}else g.strokeStyle='rgba(255,255,255,.12)';g.stroke()}
 anneau(CARTE.depart.x,CARTE.depart.y,22,'#e2ae72',2)}
function peins(){const p=monde(mx,my),c=cellOf(p.x,p.y);for(let a=-pinceau;a<=pinceau;a++)for(let b=-pinceau;b<=pinceau;b++){const k=(c.i+a)+','+(c.j+b);outil==='sol'?WALK.add(k):WALK.delete(k)}}
function edDown(e){if(e.button!==0){pan={x:mx,y:my,cx:cam.x,cy:cam.y};return}const p=monde(mx,my);
 if(mjSpawn){CARTE.camps.push([mjSpawn,Math.round(p.x),Math.round(p.y),ADV[mjSpawn].boss||ADV[mjSpawn].distance?1:mjSpawn==='kobold'?3:2]);if(!walkXY(p.x,p.y))edMsg('Posé hors du sol : peins du sol dessous.');return nouveau()}
 if(outil==='sol'||outil==='mur'){peint=true;peins()}
 else if(outil==='depart'){CARTE.depart={x:Math.round(p.x),y:Math.round(p.y)};nouveau()}
 else if(outil==='gomme'){let k=-1,bd=40;CARTE.camps.forEach((c,n)=>{const d=Math.hypot(c[1]-p.x,c[2]-p.y);if(d<bd){bd=d;k=n}});if(k>=0){CARTE.camps.splice(k,1);nouveau()}}}
function edMove(){if(pan){cam.x=pan.cx-(mx-pan.x)/cam.z;cam.y=pan.cy-(my-pan.y)/cam.z}else if(peint)peins()}
$('mjEdit').onclick=()=>entreEdit(!edit);$('edJouer').onclick=()=>entreEdit(false);
$('edOutils').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;outil=b.dataset.o;mjSpawn=null;$('mjSpawn').querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));$('edOutils').querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))};
$('edPinceau').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;pinceau=+b.dataset.p;$('edPinceau').querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))};
$('edTout').onclick=()=>{const cs=[cellOf(0,0),cellOf(WW,0),cellOf(0,WH),cellOf(WW,WH)],I=cs.map(c=>c.i),J=cs.map(c=>c.j);
 for(let i=Math.min(...I);i<=Math.max(...I);i++)for(let j=Math.min(...J);j<=Math.max(...J);j++){const p=iso(i,j);if(p.x>TW/2&&p.y>TH/2&&p.x<WW-TW/2&&p.y<WH-TH/2)WALK.add(i+','+j)}};
$('edVide').onclick=()=>WALK.clear();
$('edFond').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return edMsg('Image PNG, JPEG ou WebP seulement.');
 const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{CARTE.fond=rd.result;IMG[rd.result]=im;CARTE.w=im.naturalWidth;CARTE.h=im.naturalHeight;CARTE.nom=f.name.replace(/\.[^.]+$/,'').slice(0,60);WW=CARTE.w;WH=CARTE.h;
  WALK.clear();CARTE.camps=[];CARTE.depart={x:Math.round(WW/2),y:Math.round(WH/2)};cam.x=WW/2;cam.y=WH/2;cam.z=Math.max(zMin(),Math.min(1.8,cam.z));nouveau();edMsg('Nouveau fond : peins le sol.')};im.onerror=()=>edMsg('Image illisible.');im.src=rd.result};rd.readAsDataURL(f)};
$('edSauve').onclick=()=>{CARTE.walk=[...WALK];try{localStorage.setItem('amertume-iso-carte',JSON.stringify(CARTE));edMsg('Carte sauvée dans ce navigateur.')}catch(e){edMsg('Trop lourde pour le navigateur : exporte-la.')}};
$('edExport').onclick=()=>{CARTE.walk=[...WALK];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CARTE)],{type:'application/json'}));a.download=(CARTE.nom||'carte').replace(/[^\w-]+/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('edImport').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>40e6)return edMsg('Fichier trop lourd.');f.text().then(t=>{CARTE=valideCarte(JSON.parse(t));appliqueCarte();img(CARTE.fond);cam.x=WW/2;cam.y=WH/2;nouveau();edMsg('Carte importée.')}).catch(err=>edMsg(err.message||'Fichier illisible.'))};
$('edDemo').onclick=()=>{CARTE=valideCarte(DEMO);appliqueCarte();nouveau();edMsg('Carte de démo.')};
// Réglages
function majReg(){$('rCad').value=REG.cadence;$('vCad').textContent=String(REG.cadence).replace('.',',')+' s';$('rTour').value=REG.tour;$('vTour').textContent=String(REG.tour).replace('.',',')+' s';
 try{localStorage.setItem('amertume-iso-reglages',JSON.stringify(REG))}catch(e){}}
$('rCad').oninput=e=>{REG.cadence=+e.target.value;hero.arme.cadence=REG.cadence;hero.prochain=Math.min(hero.prochain,S.t+REG.cadence);majReg()};
$('rTour').oninput=e=>{REG.tour=+e.target.value;TOUR=REG.tour;majReg()};
majReg();
// Portrait : la tête du sprite du Destructeur.
function portrait(){const im=IMG['img/u/hrolf_idle.webp'];if(!ok(im))return setTimeout(portrait,100);const p=$('portrait').getContext('2d'),fw=im.naturalWidth/6;
 // Tête dans l'image 0 du repos : centre x ≈ 0,65, haut à 0,2 de l'image.
 p.imageSmoothingQuality='high';p.drawImage(im,fw*.46,im.naturalHeight*.19,fw*.4,fw*.4,0,0,152,152)}

let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused&&!edit){if(tenu&&!survol&&(acc+=dt)>.15){acc=0;ordre(mx,my)}step(dt)}
 if(!edit){cam.x+=(hero.x-cam.x)*Math.min(1,dt*6);cam.y+=(hero.y-30-cam.y)*Math.min(1,dt*6)}draw(now/1000);majCd();
 if(!paused&&Math.floor(S.t*4)!==Math.floor((S.t-dt)*4))majTout();requestAnimationFrame(loop)}
nouveau();portrait();requestAnimationFrame(loop);
// Accroches de test (tools/smoke.js)
window.__test={get S(){return S},get hero(){return hero},step,ordre:(x,y)=>{hero.cible=null;hero.path=chemin(hero.x,hero.y,x,y)},cible:m=>{hero.cible=m},frappeFurieuse,criDeGuerre,reposCourt,potion,lancer,resoudre,pause:v=>{paused=v},entreEdit,get WALK(){return WALK}};
window.addEventListener('error',e=>{(window.__errs=window.__errs||[]).push(e.message)});
